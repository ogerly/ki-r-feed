<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KI & Robotik Video Feed</title><meta name="description" content="Neueste Videos aus KI- und Robotik-Kanälen auf einen Blick – chronologisch sortiert, mit Live-Bereich."><meta property="og:type" content="website"><meta property="og:title" content="KI & Robotik Video Feed"><meta property="og:description" content="Neueste Videos aus KI- und Robotik-Kanälen auf einen Blick – chronologisch sortiert, mit Live-Bereich."><meta property="og:site_name" content="KI Robotik Feed">
<style>
:root{--bg:#0f0f0f;--card:#1a1a1a;--txt:#f1f1f1;--mut:#aaa;--acc:#3ea6ff;--live:#e62117;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,sans-serif;padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
header{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;padding-top:calc(env(safe-area-inset-top) + 10px);border-bottom:1px solid #272727}
header h1{font-size:18px;margin:0;white-space:nowrap}
#tabs{display:flex;gap:6px}
#tabs button{background:#161616;color:var(--mut);border-radius:14px;padding:7px 11px;font-size:13.5px}
#tabs button.on{background:var(--acc);color:#00131f;font-weight:700}
#src{background:#161616;color:var(--mut);border-radius:14px;padding:7px 11px;font-size:13.5px;text-decoration:none;white-space:nowrap}
#src.on{background:var(--acc);color:#00131f;font-weight:700}
#sources{display:none}
body.quellen #sources{display:block}
body.quellen #q,body.quellen #rf,body.quellen #live,body.quellen #shorts,body.quellen h2,body.quellen #g,body.quellen #more,body.quellen #empty{display:none}
.slist h3{margin:16px 2px 8px;color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.07em}
.src{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 13px;background:var(--card);border-radius:10px;margin-bottom:8px;text-decoration:none;color:var(--txt)}
.src:hover{background:#242424}
.src span{color:var(--mut);font-size:12.5px;white-space:nowrap}
@media(max-width:560px){header h1{display:none}}
#q{flex:1;min-width:0;background:#121212;border:1px solid #303030;color:var(--txt);border-radius:20px;padding:8px 14px;font-size:15px}
button{background:#272727;color:var(--txt);border:0;border-radius:18px;padding:8px 12px;cursor:pointer}
main{padding:12px;max-width:1600px;margin:auto}
h2{font-size:16px;margin:8px 0 10px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--live);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}}
.grid{display:grid;gap:16px 12px;grid-template-columns:1fr}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1300px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{cursor:pointer;border-radius:12px;overflow:hidden}
.th{position:relative;aspect-ratio:16/9;background:#222;border-radius:12px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;bottom:8px;background:var(--live);font-weight:700;font-size:12px;padding:2px 6px;border-radius:4px}
.badge.up{background:#555}
.t{margin:8px 2px 0;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{color:var(--mut);margin:2px 2px 0;font-size:12.5px}
#live{margin-bottom:22px}
#live .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
#shorts{margin-bottom:22px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px}
.hscroll::-webkit-scrollbar{height:8px}
.hscroll::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
.scard{flex:0 0 auto;width:130px;scroll-snap-align:start;cursor:pointer}
.scard .sth{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#222}
.scard .sth img{width:100%;height:100%;object-fit:cover;display:block}
.scard .st{margin:6px 2px 0;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .sm{color:var(--mut);font-size:11.5px;margin:2px 2px 0}
@media(min-width:800px){.scard{width:155px}}
#dock{position:fixed;z-index:20;left:0;right:0;bottom:0;background:#000;box-shadow:0 -4px 20px #000a;display:none;padding-bottom:env(safe-area-inset-bottom)}
#dock.on{display:block}
#dock .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;font-size:13px}
#dock .bar span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#dock .fr{aspect-ratio:16/9;width:100%}
#dock iframe{width:100%;height:100%;border:0;display:block}
#dock.min .fr{display:none}
@media(min-width:800px){#dock{left:auto;right:16px;bottom:16px;width:420px;border-radius:12px;overflow:hidden}}
body.pad{padding-bottom:calc(env(safe-area-inset-bottom) + 300px)}
#empty{color:var(--mut);padding:40px 0;text-align:center}
</style>
</head>
<body>
<header>
  <h1>KI+R Feed</h1>
  <nav id="tabs"><button data-cat="all" class="on">Alle</button><button data-cat="ki">KI</button><button data-cat="robotic">Robotik</button></nav>
  <input id="q" type="search" placeholder="Videos oder Kanäle suchen">
  <a id="src" href="/quellen">Quellen</a>
  <button id="rf" title="Aktualisieren">⟳</button>
</header>
<main>
  <section id="live" hidden><h2><span class="dot"></span>Jetzt live</h2><div class="grid" id="lg"></div></section>
  <section id="shorts" hidden><h2>Shorts</h2><div class="hscroll" id="sg"></div></section>
  <h2>Neueste Videos</h2>
  <div class="grid" id="g"></div>
  <div style="text-align:center;margin:20px"><button id="more" hidden>Mehr laden</button></div>
  <div id="empty">Lade …</div>
  <section id="sources"><h2>Quellen</h2><div class="slist" id="sl">Lade …</div></section>
</main>
<div id="dock">
  <div class="bar"><span id="pt"></span><div><button id="mn">Min</button> <button id="cl">✕</button></div></div>
  <div class="fr"><iframe id="pf" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
</div>
<script>
const $=id=>document.getElementById(id);
let vids=[],live=[],shorts=[],more=false,busy=false,liveBusy=false,queued=false,seq=0,t;
const PATHCAT={"/":"all","/ki":"ki","/robotik":"robotic"},CATPATH={all:"/",ki:"/ki",robotic:"/robotik"};
let cat=PATHCAT[location.pathname]||"all";
let view=location.pathname==="/quellen"?"quellen":"feed";
if(view==="quellen")document.body.classList.add("quellen");
const ago=s=>{const d=(Date.now()-new Date(s))/1000;
  if(d<3600)return`vor ${Math.max(1,d/60|0)} Min.`;
  if(d<86400)return`vor ${d/3600|0} Std.`;
  if(d<2592000)return`vor ${d/86400|0} Tagen`;
  return new Date(s).toLocaleDateString('de-DE')};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const card=v=>`<div class="card" data-id="${v.id}">
  <div class="th"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="">
  ${v.live?'<span class="badge">LIVE</span>':v.upcoming?'<span class="badge up">GEPLANT</span>':''}</div>
  <div class="t">${esc(v.title)}</div><div class="m">${esc(v.channel)} · ${ago(v.published)}</div></div>`;
let mode=null,ds=null;
async function probe(){
  try{
    const r=await fetch("/api/channels",{cache:"no-store"});
    if(r.ok&&(r.headers.get("content-type")||"").includes("json"))return"api";
  }catch(e){}
  return"static";
}
async function staticData(){
  if(!ds)ds=await(await fetch("data/videos.json",{cache:"no-store"})).json();
  return ds;
}
const catOk=v=>cat==="all"||v.cat===cat;
async function fetchPage(p){
  if(mode==="api")return(await(await fetch("/api/videos?"+new URLSearchParams(p))).json());
  const d=await staticData();
  let f=d.videos.filter(v=>!v.live&&!v.shorts&&catOk(v));
  const q=(p.q||"").toLowerCase();
  if(q)f=f.filter(v=>(v.title+" "+v.channel).toLowerCase().includes(q));
  f.sort((a,b)=>b.published.localeCompare(a.published)||b.id.localeCompare(a.id));
  let i=0;
  if(p.before_id){
    i=f.findIndex(v=>v.id===p.before_id)+1;
    if(i===0&&p.before)i=f.findIndex(v=>v.published<p.before)+1;
    if(i<0)i=0;
  }
  const n=+p.limit||48;
  const chunk=f.slice(i,i+n);
  return{videos:chunk,has_more:i+chunk.length<f.length};
}
const scard=v=>`<div class="scard" data-id="${v.id}">
  <div class="sth"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/oar2.jpg" onerror="this.onerror='';this.src='https://i.ytimg.com/vi/${v.id}/mqdefault.jpg'" alt=""></div>
  <div class="st">${esc(v.title)}</div><div class="sm">${esc(v.channel)}</div></div>`;
function paint(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",view==="feed"&&b.dataset.cat===cat));
  $("src").classList.toggle("on",view==="quellen");
  $('live').hidden=!live.length;
  $('lg').innerHTML=live.map(card).join('');
  $('shorts').hidden=!shorts.length;
  $('sg').innerHTML=shorts.map(scard).join('');
  $('g').innerHTML=vids.map(card).join('');
  $('more').hidden=!more;
  $('empty').hidden=vids.length>0;
  $('empty').textContent=$('q').value?'Keine Treffer.':'Noch keine Videos in dieser Kategorie – der erste Abruf läuft.';
}
async function load(reset=true){
  if(busy){queued=true;return;}
  busy=true;const s=++seq;
  const p={limit:48};
  if(cat!=="all")p.cat=cat;
  const q=$('q').value.trim();if(q)p.q=q;
  if(!reset&&vids.length){const l=vids[vids.length-1];p.before=l.published;p.before_id=l.id}
  try{const d=await fetchPage(p);if(s===seq){vids=reset?d.videos:vids.concat(d.videos);more=d.has_more;paint()}}
  catch(e){if(s===seq)$('empty').textContent='Fehler beim Laden.'}
  busy=false;
  if(s!==seq)return;
  if(queued){queued=false;load();return}
  if(!vids.length&&!q)setTimeout(()=>load(),5000);
}
async function loadLive(){
  if(liveBusy)return;liveBusy=true;
  try{
    if(mode==="api")live=(await(await fetch("/api/live"+(cat!=="all"?"?cat="+cat:""))).json()).videos;
    else{const d=await staticData();live=d.videos.filter(v=>v.live&&catOk(v)).sort((a,b)=>b.published.localeCompare(a.published))}
    paint();
  }catch(e){}
  liveBusy=false;
}
async function loadShorts(){
  try{
    if(mode==="api")shorts=(await(await fetch("/api/shorts?limit=30"+(cat!=="all"?"&cat="+cat:""))).json()).videos;
    else{const d=await staticData();shorts=d.videos.filter(v=>v.shorts&&catOk(v)).sort((a,b)=>b.published.localeCompare(a.published)).slice(0,30)}
    paint();
  }catch(e){}
}
function goFeed(c,push=true){
  view="feed";document.body.classList.remove("quellen");
  cat=c;
  if(push){const p=CATPATH[c];if(location.pathname!==p)history.pushState({},"",p)}
  vids=[];more=false;paint();load();loadLive();loadShorts();
}
function goQuellen(push=true){
  view="quellen";document.body.classList.add("quellen");
  if(push&&location.pathname!="/quellen")history.pushState({},"","/quellen");
  paint();loadSources();
}
async function loadSources(){
  try{
    let chans;
    if(mode==="api")chans=await(await fetch("/api/channels")).json();
    else chans=(await staticData()).channels;
    const cats=[...new Set(chans.map(c=>c.cat))];
    const label={ki:"KI",robotic:"Robotik"};
    $("sl").innerHTML=cats.map(c=>
      `<h3>${esc(label[c]||c)} · ${chans.filter(x=>x.cat===c).length} Kanäle</h3>`+
      chans.filter(x=>x.cat===c).map(x=>
        `<a class="src" href="${x.url}" target="_blank" rel="noopener">${esc(x.name)}<span>${x.count?x.count+" Videos":""}</span></a>`
      ).join("")
    ).join("");
  }catch(e){$("sl").innerHTML="Fehler beim Laden."}
}
function play(id){
  const v=[...live,...vids,...shorts].find(x=>x.id===id);
  $('pf').src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;
  $('pt').textContent=v?v.title:'';
  $('dock').className='on';document.body.classList.add('pad');
}
document.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)play(c.dataset.id)});
$('cl').onclick=()=>{$('pf').src='';$('dock').className='';document.body.classList.remove('pad')};
$('mn').onclick=()=>{$('dock').classList.toggle('min')};
$('q').oninput=()=>{clearTimeout(t);t=setTimeout(()=>load(),250)};
$('more').onclick=()=>load(false);
$('rf').onclick=async()=>{
  $('rf').disabled=true;
  if(mode==="api"){try{await fetch('/api/refresh',{method:'POST'})}catch(e){}}
  else ds=null;
  $('rf').disabled=false;
  load();loadLive();loadShorts();
};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>goFeed(b.dataset.cat));
$("src").onclick=e=>{e.preventDefault();goQuellen();};
window.addEventListener("popstate",()=>{
  if(location.pathname==="/quellen")goQuellen(false);
  else goFeed(PATHCAT[location.pathname]||"all",false);
});
(async()=>{
  mode=await probe();
  if(view==="quellen")goQuellen(false);
  else goFeed(PATHCAT[location.pathname]||"all",false);
  setInterval(loadLive,60000);
  setInterval(()=>{if(mode==="static")ds=null;load();loadLive();loadShorts()},300000);
})();
</script>
</body>
</html>
